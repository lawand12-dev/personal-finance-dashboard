<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINOVA — Personal Finance Dashboard</title>
    <meta
      name="description"
      content="FINOVA — a calm, professional personal finance dashboard."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased">
    <!-- ============================ SIDEBAR ============================ -->
    <aside
      class="sidebar fixed inset-y-0 left-0 z-50 flex w-[var(--sidebar-w)] flex-col border-r border-[var(--sidebar-border)] bg-[var(--sidebar-bg)] p-5 text-[var(--sidebar-text)]"
      id="sidebar"
    >
      <div class="brand flex items-center gap-2.5 pb-6">
        <span
          class="brand-mark grid h-8 w-8 place-items-center rounded-lg bg-[var(--green)] text-white"
          aria-hidden="true"
        >
          <i data-lucide="trending-up"></i>
        </span>
        <span
          class="brand-name text-base font-extrabold tracking-[0.12em] text-white"
        >
          FINOVA
        </span>
      </div>

      <nav
        class="nav flex flex-col gap-1"
        id="nav"
        aria-label="Main navigation"
      >
        <button
          class="nav-item flex w-full items-center gap-3 rounded-lg border-0 bg-transparent px-3 py-2.5 text-left text-[var(--sidebar-text)] transition hover:bg-white/5 hover:text-white"
          data-view="dashboard"
          type="button"
        >
          <i data-lucide="layout-grid"></i>
          <span class="nav-label">Dashboard</span>
        </button>
        <button
          class="nav-item flex w-full items-center gap-3 rounded-lg border-0 bg-transparent px-3 py-2.5 text-left text-[var(--sidebar-text)] transition hover:bg-white/5 hover:text-white"
          data-view="transactions"
          type="button"
        >
          <i data-lucide="list"></i>
          <span class="nav-label">Transactions</span>
        </button>
        <button
          class="nav-item flex w-full items-center gap-3 rounded-lg border-0 bg-transparent px-3 py-2.5 text-left text-[var(--sidebar-text)] transition hover:bg-white/5 hover:text-white"
          data-view="categories"
          type="button"
        >
          <i data-lucide="tags"></i>
          <span class="nav-label">Categories</span>
        </button>
        <button
          class="nav-item flex w-full items-center gap-3 rounded-lg border-0 bg-transparent px-3 py-2.5 text-left text-[var(--sidebar-text)] transition hover:bg-white/5 hover:text-white"
          data-view="reports"
          type="button"
        >
          <i data-lucide="bar-chart-3"></i>
          <span class="nav-label">Reports</span>
        </button>
        <button
          class="nav-item flex w-full items-center gap-3 rounded-lg border-0 bg-transparent px-3 py-2.5 text-left text-[var(--sidebar-text)] transition hover:bg-white/5 hover:text-white"
          data-view="settings"
          type="button"
        >
          <i data-lucide="settings"></i>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div
        class="sidebar-foot mt-auto border-t border-[var(--sidebar-border)] pt-3"
      >
        <div
          class="user-card flex items-center gap-2.5 rounded-lg px-2.5 py-2.5 transition hover:bg-white/5"
        >
          <span class="avatar" id="sidebarAvatar"></span>
          <span class="user-meta flex min-w-0 flex-col">
            <span
              class="user-name text-sm font-semibold text-white"
              id="sidebarName"
            ></span>
            <span
              class="user-mail text-[11px] text-slate-400"
              id="sidebarMail"
            ></span>
          </span>
        </div>
        <button
          class="nav-item mt-1 flex w-full items-center gap-3 rounded-lg border-0 bg-transparent px-3 py-2.5 text-left text-[var(--sidebar-text)] transition hover:bg-white/5 hover:text-white"
          data-action="logout"
          type="button"
        >
          <i data-lucide="log-out"></i>
          <span class="nav-label">Log out</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ============================ MAIN ============================ -->
    <div class="main flex min-h-screen flex-col">
      <header
        class="topbar sticky top-0 z-40 flex h-[var(--topbar-h)] items-center gap-3 border-b border-[var(--border)] bg-[var(--surface)] px-7 text-[var(--text)]"
      >
        <button
          class="icon-btn menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open navigation"
        >
          <i data-lucide="menu"></i>
        </button>

        <h1 class="topbar-title" id="pageTitle">Dashboard</h1>
        <div class="topbar-spacer"></div>

        <div class="search topbar-search">
          <i data-lucide="search"></i>
          <input
            class="input"
            id="globalSearch"
            type="search"
            placeholder="Search transactions…"
            aria-label="Search transactions"
          />
        </div>

        <div class="pop-wrap">
          <button
            class="icon-btn dot-badge"
            id="notifBtn"
            type="button"
            aria-label="Notifications"
            aria-expanded="false"
          >
            <i data-lucide="bell"></i>
          </button>
          <div
            class="popover"
            id="notifPop"
            role="dialog"
            aria-label="Notifications"
          >
            <div class="popover-head">
              <span class="popover-title">Notifications</span>
              <span class="badge badge-gray"></span>
            </div>
            <div class="popover-item">
              <i data-lucide="triangle-alert" style="color: var(--amber)"></i>
              <div>
                <p></p>
                <span></span>
              </div>
            </div>
            <div class="popover-item">
              <i data-lucide="check" style="color: var(--green)"></i>
              <div>
                <p></p>
                <span></span>
              </div>
            </div>
            <div class="popover-item">
              <i data-lucide="bar-chart-3" style="color: var(--blue-text)"></i>
              <div>
                <p></p>
                <span></span>
              </div>
            </div>
          </div>
        </div>

        <button
          class="icon-btn"
          id="themeBtn"
          type="button"
          aria-label="Toggle dark mode"
        ></button>

        <button
          class="icon-btn"
          id="profileBtn"
          type="button"
          aria-label="Account"
        >
          <span class="avatar sm" id="topAvatar">AR</span>
        </button>
      </header>

      <main
        class="content mx-auto w-full max-w-[1400px] flex-1 px-7 py-7"
        id="content"
        role="main"
      ></main>
    </div>

    <!-- ============================ MODALS ============================ -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <div class="modal-backdrop" id="confirmBackdrop" aria-hidden="true">
      <div
        class="modal sm"
        id="confirmModal"
        role="alertdialog"
        aria-modal="true"
      ></div>
    </div>

    <div
      class="toasts"
      id="toasts"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <!-- ============================ SCRIPTS ============================ -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
