<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINOVA — Personal Finance Dashboard</title>
    <meta
      name="description"
      content="FINOVA — a calm, professional personal finance dashboard."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- ============================ SIDEBAR ============================ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 17.5 8.5 12l4 3.5L21 6.5" />
            <path d="M15 6.5h6v6" />
          </svg>
        </span>
        <span class="brand-name">FINOVA</span>
      </div>

      <nav class="nav" id="nav" aria-label="Main navigation">
        <button class="nav-item" data-view="dashboard" type="button">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="transactions" type="button">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
          </svg>
          <span class="nav-label">Transactions</span>
        </button>
        <button class="nav-item" data-view="categories" type="button">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
            />
            <path d="M7 7h.01" />
          </svg>
          <span class="nav-label">Categories</span>
        </button>
        <button class="nav-item" data-view="reports" type="button">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 20V10M12 20V4M6 20v-6" />
          </svg>
          <span class="nav-label">Reports</span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="user-card">
          <span class="avatar" id="sidebarAvatar">AR</span>
          <span class="user-meta">
            <span class="user-name" id="sidebarName">Alex Rivera</span>
            <span class="user-mail" id="sidebarMail">alex@finova.app</span>
          </span>
        </div>
        <button class="nav-item" data-action="logout" type="button">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          <span class="nav-label">Log out</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ============================ MAIN ============================ -->
    <div class="main">
      <header class="topbar">
        <button
          class="icon-btn menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open navigation"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M3 12h18M3 6h18M3 18h18" />
          </svg>
        </button>

        <h1 class="topbar-title" id="pageTitle">Dashboard</h1>
        <div class="topbar-spacer"></div>

        <div class="search topbar-search">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            class="input"
            id="globalSearch"
            type="search"
            placeholder="Search transactions…"
            aria-label="Search transactions"
          />
        </div>

        <div class="pop-wrap">
          <button
            class="icon-btn dot-badge"
            id="notifBtn"
            type="button"
            aria-label="Notifications"
            aria-expanded="false"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </button>
          <div
            class="popover"
            id="notifPop"
            role="dialog"
            aria-label="Notifications"
          >
            <div class="popover-head">
              <span class="popover-title">Notifications</span>
              <span class="badge badge-gray">3 new</span>
            </div>
            <div class="popover-item">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--amber)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="m10.29 3.86-8.47 14.14A2 2 0 0 0 3.54 21h16.92a2 2 0 0 0 1.72-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                />
                <path d="M12 9v4M12 17h.01" />
              </svg>
              <div>
                <p>Shopping is at 92% of budget</p>
                <span>2 hours ago</span>
              </div>
            </div>
            <div class="popover-item">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--green)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
              <div>
                <p>Salary of $4,850.00 received</p>
                <span>Yesterday</span>
              </div>
            </div>
            <div class="popover-item">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--blue-text)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 20V10M12 20V4M6 20v-6" />
              </svg>
              <div>
                <p>Your monthly report is ready</p>
                <span>2 days ago</span>
              </div>
            </div>
          </div>
        </div>

        <button
          class="icon-btn"
          id="themeBtn"
          type="button"
          aria-label="Toggle dark mode"
        ></button>

        <button
          class="icon-btn"
          id="profileBtn"
          type="button"
          aria-label="Account"
        >
          <span class="avatar sm" id="topAvatar">AR</span>
        </button>
      </header>

      <main class="content" id="content" role="main"></main>
    </div>

    <!-- ============================ MODALS ============================ -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <div class="modal-backdrop" id="confirmBackdrop" aria-hidden="true">
      <div
        class="modal sm"
        id="confirmModal"
        role="alertdialog"
        aria-modal="true"
      ></div>
    </div>

    <div
      class="toasts"
      id="toasts"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <!-- ============================ SCRIPTS (order matters) ============================ -->
    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/views.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
