<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINOVA — Personal Finance Dashboard</title>
    <meta
      name="description"
      content="FINOVA — a calm, professional personal finance dashboard."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- ============================ SIDEBAR ============================ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i data-lucide="trending-up"></i>
        </span>
        <span class="brand-name">FINOVA</span>
      </div>

      <nav class="nav" id="nav" aria-label="Main navigation">
        <button class="nav-item" data-view="dashboard" type="button">
          <i data-lucide="layout-grid"></i>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="transactions" type="button">
          <i data-lucide="list"></i>
          <span class="nav-label">Transactions</span>
        </button>
        <button class="nav-item" data-view="categories" type="button">
          <i data-lucide="tags"></i>
          <span class="nav-label">Categories</span>
        </button>
        <button class="nav-item" data-view="reports" type="button">
          <i data-lucide="bar-chart-3"></i>
          <span class="nav-label">Reports</span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <i data-lucide="settings"></i>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="user-card">
          <span class="avatar" id="sidebarAvatar"></span>
          <span class="user-meta">
            <span class="user-name" id="sidebarName"></span>
            <span class="user-mail" id="sidebarMail"></span>
          </span>
        </div>
        <button class="nav-item" data-action="logout" type="button">
          <i data-lucide="log-out"></i>
          <span class="nav-label">Log out</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ============================ MAIN ============================ -->
    <div class="main">
      <header class="topbar">
        <button
          class="icon-btn menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open navigation"
        >
          <i data-lucide="menu"></i>
        </button>

        <h1 class="topbar-title" id="pageTitle">Dashboard</h1>
        <div class="topbar-spacer"></div>

        <div class="search topbar-search">
          <i data-lucide="search"></i>
          <input
            class="input"
            id="globalSearch"
            type="search"
            placeholder="Search transactions…"
            aria-label="Search transactions"
          />
        </div>

        <div class="pop-wrap">
          <button
            class="icon-btn dot-badge"
            id="notifBtn"
            type="button"
            aria-label="Notifications"
            aria-expanded="false"
          >
            <i data-lucide="bell"></i>
          </button>
          <div
            class="popover"
            id="notifPop"
            role="dialog"
            aria-label="Notifications"
          >
            <div class="popover-head">
              <span class="popover-title">Notifications</span>
              <span class="badge badge-gray"></span>
            </div>
            <div class="popover-item">
              <i data-lucide="triangle-alert" style="color: var(--amber)"></i>
              <div>
                <p></p>
                <span></span>
              </div>
            </div>
            <div class="popover-item">
              <i data-lucide="check" style="color: var(--green)"></i>
              <div>
                <p></p>
                <span></span>
              </div>
            </div>
            <div class="popover-item">
              <i data-lucide="bar-chart-3" style="color: var(--blue-text)"></i>
              <div>
                <p></p>
                <span></span>
              </div>
            </div>
          </div>
        </div>

        <button
          class="icon-btn"
          id="themeBtn"
          type="button"
          aria-label="Toggle dark mode"
        ></button>

        <button
          class="icon-btn"
          id="profileBtn"
          type="button"
          aria-label="Account"
        >
          <span class="avatar sm" id="topAvatar">AR</span>
        </button>
      </header>

      <main class="content" id="content" role="main"></main>
    </div>

    <!-- ============================ MODALS ============================ -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <div class="modal-backdrop" id="confirmBackdrop" aria-hidden="true">
      <div
        class="modal sm"
        id="confirmModal"
        role="alertdialog"
        aria-modal="true"
      ></div>
    </div>

    <div
      class="toasts"
      id="toasts"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <!-- ============================ SCRIPTS (order matters) ============================ -->
    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/views.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
